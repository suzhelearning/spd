[workspace]
name = "spd-sim"
version = "0.1.0"
description = "Joint-command subscriber and MuJoCo simulation data collection"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[feature.sim.dependencies]
python = "3.12.*"
setuptools = ">=61,<80"
h5py = "*"
pillow = "*"
pyyaml = "*"
numpy = "*"
mujoco = "3.12.*"
scipy = ">=1.11.0"
trimesh = ">=4.8,<5"
pyglfw = ">=2.10.2,<3"

[feature.sim.pypi-dependencies]
spd = { path = ".", editable = true }
spd-envs = { path = "src/environments/spd_envs", editable = true }
coacd = "==1.0.14"

[environments]
default = { features = ["sim"], solve-group = "default" }
ros-jazzy = { features = ["sim", "ros-jazzy"], solve-group = "default" }
render = { features = ["sim"], solve-group = "default" }
teleop-native = { features = ["teleop-native"], no-default-feature = true, solve-group = "teleop-native" }

[tasks]
spd-envs-check = "validate_scenes"
spd-model = "python -m description.model_compiler.cli --urdf src/tianji_wuji2/tianji_wuji2/assets/tianji_wuji2.urdf --output src/tianji_wuji2/tianji_wuji2/generated --cache src/tianji_wuji2/tianji_wuji2/collision_cache --raw-collisions"
spd-scene = "pixi run -e ros-jazzy bash bash/run_native_python.sh -m simulation.scene"
spd-render = "python -m offline_rendering"
spd-augment = "python -m training_data"
spd-quest-receive = "python tools/hand_tracking/quest_hand_tracking_receiver.py"
spd-quest-teleop = "bash bash/run_quest_hand_sim.sh"
spd-pico-teleop = "bash bash/run_pico_hand_sim.sh"
spd-teleop-build = "bash bash/build_teleop.sh"
ros-build-interfaces = "pixi run -e ros-jazzy bash -lc 'colcon build --base-paths src/interfaces/tianji_spd_interfaces --build-base .ros/build --install-base .ros/install --merge-install'"
spd-native-build = "pixi run -e ros-jazzy bash bash/build_native.sh"
spd-test = "pixi run -e ros-jazzy bash bash/run_native_python.sh -m unittest discover -s tests -v"

[feature.ros-jazzy.tasks]
spd-sim = "bash bash/start_spd_sim.sh"
spd-collect = "bash bash/run_data_collector.sh"
spd-collect-trigger = "bash bash/collect_trigger.sh"

[feature.ros-jazzy.dependencies]
ros-jazzy-rclpy = ">=7.1,<8"
ros-jazzy-rmw-fastrtps-cpp = ">=8.4,<9"
ros-jazzy-rosidl-default-generators = ">=1.6,<2"
ros-jazzy-rosidl-default-runtime = ">=1.6,<2"
ros-jazzy-rosidl-typesupport-fastrtps-c = "*"
ros-jazzy-rosidl-typesupport-fastrtps-cpp = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-std-srvs = "*"
colcon-core = "*"
colcon-ros = "*"
ros-jazzy-rclcpp = ">=28.1.21,<29"
pybind11 = ">=3.0.4,<4"
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"

[feature.ros-jazzy.activation.env]
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
ROS_DOMAIN_ID = "120"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_STATIC_PEERS = ""

# Arm workers keep their validated MuJoCo/Pinocchio ABI outside the simulator.
[feature.teleop-native.dependencies]
cmake = ">=3.24,<4"
ninja = ">=1.11"
cxx-compiler = ">=1.9"
pkg-config = "*"
eigen = ">=3.4,<4"
libpinocchio = ">=3.8,<4"
libmujoco = "==3.10.0"
glfw = ">=3.4,<4"
yaml-cpp = ">=0.8,<1"
