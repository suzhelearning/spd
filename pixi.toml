[workspace]
name = "spd-sim"
version = "0.1.0"
description = "PICO_2-driven Tianji arm and Wuji Hand 2 simulation demonstration collection"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[feature.sim.dependencies]
python = "3.11.*"
setuptools = ">=61,<80"
pytest = "*"
h5py = "*"
pillow = "*"
tk = { version = "8.6.*", build = "xft_*" }
pyyaml = "*"
mujoco = "3.12.*"
nlopt = "*"
pinocchio = ">=3.6,<4"
scipy = ">=1.11.0"
osqp = ">=1,<2"
trimesh = ">=4.8,<5"
tmux = ">=3.7b,<4"

[feature.sim.pypi-dependencies]
wuji-retargeting = { path = "packages/wuji-retargeting", editable = true }
spd-vr = { path = "packages/spd-vr", editable = true }
spd-envs = { path = "packages/spd-envs", editable = true }
pico-hand-tracking = { path = "packages/pico-hand-tracking", editable = true }
eclipse-zenoh = "==1.10.0"
coacd = "==1.0.14"

[environments]
default = { features = ["sim"], solve-group = "default" }
ros-jazzy = { features = ["ros-jazzy"], solve-group = "ros-jazzy" }

[tasks]
test = "python -m pytest packages/spd-vr/test"
spd-envs-check = "validate_scenes"
pico2-hand = "pico-hand-tracking --print"
pico2-bridge = "spd-pico2-bridge"
spd-model = "python -m spd_vr.model_compiler.cli --urdf assets/tianji_wuji2/tianji_wuji2.urdf --output packages/spd-vr/generated --cache packages/spd-vr/collision_cache --raw-collisions"
spd-scene = "python -m spd_vr.scene"
spd-demo = "python scripts/run_recorded_demo.py"
spd-pico = "python scripts/run_pico_teleop.py"
spd-teleop = "bash scripts/start_spd_vr.sh"
spd-teleop-status = "spd-status"
spd-teleop-stop = "bash scripts/stop_spd_vr.sh"
spd-teleop-e2e = "python scripts/test_spd_teleop_e2e.py --json /tmp/spd-teleop-e2e.json"
ros-build-interfaces = "pixi run -e ros-jazzy bash -lc 'colcon build --base-paths packages/tianji-spd-interfaces --build-base .ros/build --install-base .ros/install --merge-install'"
spd-teleop-ros = "bash scripts/start_spd_ros.sh"
spd-teleop-ros-stop = "bash scripts/stop_spd_ros.sh"
ros-bridge-install = "bash scripts/install_ros_bridge.sh"
ros-bridge-publisher = "bash scripts/run_ros_bridge.sh publisher"
ros-bridge-spd = "bash scripts/run_ros_bridge.sh spd"

[feature.ros-jazzy.dependencies]
python = "3.11.*"
ros-jazzy-rclpy = "7.1.3"
ros-jazzy-rmw-fastrtps-cpp = "8.4.1"
ros-jazzy-rosidl-default-generators = "1.6.0"
numpy = "*"
h5py = "*"
pillow = "*"
tk = { version = "8.6.*", build = "xft_*" }
pyyaml = "*"
pinocchio = ">=3.6,<4"
ros-jazzy-rosidl-default-runtime = "1.6.0"
colcon-core = "*"
colcon-ros = "*"

[feature.ros-jazzy.pypi-dependencies]
wuji-retargeting = { path = "packages/wuji-retargeting", editable = true }
spd-vr = { path = "packages/spd-vr", editable = true }
spd-envs = { path = "packages/spd-envs", editable = true }
pico-hand-tracking = { path = "packages/pico-hand-tracking", editable = true }
eclipse-zenoh = "==1.10.0"
coacd = "==1.0.14"

[feature.ros-jazzy.activation.env]
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
ROS_DOMAIN_ID = "121"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_STATIC_PEERS = ""

