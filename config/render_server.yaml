version: 1
# Copy complete trajectory date directories, including dataset_config.json.
input_dir: /data/TianjiSim/trajectories
# Keep rendered products separate; raw trajectories remain read-only.
output_dir: /data/TianjiSim-rendered
# EGL enumeration indices, NOT guaranteed to match nvidia-smi/CUDA ordinals.
# Run --check-gpus on the server before using these eight indices.
gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
expected_gpu_name: RTX 5090
workers_per_gpu: 1
threads_per_worker: 1
startup_timeout_s: 60
render:
  width: 224
  height: 168
  jpeg_quality: 90
  # Camera positions are intentionally not specified here. Use final URDF-derived
  # model cameras; provisional camera snapshots require an explicit diagnostic opt-in.
  allow_provisional_cameras: false
