[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spd-envs"
version = "0.1.0"
description = "Deterministic MuJoCo scenes and task environments for SPD simulation collection"
requires-python = ">=3.11"
dependencies = ["numpy", "mujoco>=3.12,<3.13"]

[project.scripts]
validate_scenes = "spd_envs.validate:main"

[tool.setuptools.packages.find]
include = ["spd_envs*"]
